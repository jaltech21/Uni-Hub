<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f5f7fb"/>
  <style>
    .entity{fill:#fff;stroke:#3b5bfd;stroke-width:3}
    .head{fill:#e7ecff;stroke:#3b5bfd;stroke-width:3}
    .title{font:700 24px Arial;fill:#172033}
    .field{font:16px Arial;fill:#344054}
    .rel{stroke:#667085;stroke-width:3;fill:none}
    .card{font:700 16px Arial;fill:#667085}
  </style>
  <text x="700" y="42" text-anchor="middle" class="title">UniHub class and entity-relationship diagram</text>
  <g>
    <rect x="540" y="85" width="320" height="190" class="entity"/>
    <rect x="540" y="85" width="320" height="45" class="head"/>
    <text x="700" y="115" text-anchor="middle" class="title">User</text>
    <text x="560" y="160" class="field">id, email, username</text><text x="560" y="188" class="field">role, department_id</text>
    <text x="560" y="216" class="field">first_name, last_name</text><text x="560" y="244" class="field">authentication fields</text>
  </g>
  <g>
    <rect x="70" y="350" width="300" height="190" class="entity"/>
    <rect x="70" y="350" width="300" height="45" class="head"/>
    <text x="220" y="380" text-anchor="middle" class="title">Note</text>
    <text x="90" y="425" class="field">user_id, folder_id</text><text x="90" y="453" class="field">department_id, title</text>
    <text x="90" y="481" class="field">content, timestamps</text><text x="90" y="509" class="field">tags, shares, versions</text>
  </g>
  <g>
    <rect x="550" y="350" width="300" height="190" class="entity"/>
    <rect x="550" y="350" width="300" height="45" class="head"/>
    <text x="700" y="380" text-anchor="middle" class="title">Assignment</text>
    <text x="570" y="425" class="field">user_id, schedule_id</text><text x="570" y="453" class="field">department_id, title</text>
    <text x="570" y="481" class="field">description, due_date</text><text x="570" y="509" class="field">category, points</text>
  </g>
  <g>
    <rect x="1030" y="350" width="300" height="190" class="entity"/>
    <rect x="1030" y="350" width="300" height="45" class="head"/>
    <text x="1180" y="380" text-anchor="middle" class="title">Schedule</text>
    <text x="1050" y="425" class="field">user_id, instructor_id</text><text x="1050" y="453" class="field">department_id, course</text>
    <text x="1050" y="481" class="field">day_of_week, room</text><text x="1050" y="509" class="field">start_time, end_time</text>
  </g>
  <g>
    <rect x="300" y="670" width="300" height="150" class="entity"/>
    <rect x="300" y="670" width="300" height="45" class="head"/>
    <text x="450" y="700" text-anchor="middle" class="title">Submission</text>
    <text x="320" y="745" class="field">assignment_id, user_id</text><text x="320" y="773" class="field">status, grade</text><text x="320" y="801" class="field">submitted_at, graded_by</text>
  </g>
  <g>
    <rect x="800" y="670" width="300" height="150" class="entity"/>
    <rect x="800" y="670" width="300" height="45" class="head"/>
    <text x="950" y="700" text-anchor="middle" class="title">Enrollment</text>
    <text x="820" y="745" class="field">user_id, schedule_id</text><text x="820" y="773" class="field">status, academic_year</text><text x="820" y="801" class="field">semester</text>
  </g>
  <path d="M540 190 L370 410 M700 275 L700 350 M860 190 L1180 350 M630 540 L500 670 M770 540 L900 670" class="rel"/>
  <text x="448" y="292" class="card">1 to *</text><text x="718" y="320" class="card">1 to *</text>
  <text x="950" y="285" class="card">1 to *</text><text x="525" y="615" class="card">1 to *</text><text x="825" y="615" class="card">1 to *</text>
  <text x="700" y="865" text-anchor="middle" class="field">Core entities and fields shown are limited to relationships confirmed in the Rails models.</text>
</svg>
